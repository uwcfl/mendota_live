<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lake Mendota Buoy Data</title>
  <link rel="icon" type="image/png" href="assets/CFL-Logo.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Mendota Buoy">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b3d4c">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>

<body>
  <div id="dashboard">
    <aside id="sidebar">
      <div class="brand">
        <img src="assets/CFL-Logo.png" alt="Center for Limnology logo" class="cfl-logo">
        <h1>Lake Mendota<span>Live Buoy Data</span></h1>
      </div>

      <div class="stat-grid">
        <div class="stat-tile">
          <div class="stat-label">Surface Temperature</div>
          <div class="stat-value"><span id="val-surface">&ndash;</span><span class="stat-unit">&deg;C</span> <span class="stat-fahrenheit">(<span id="val-surface-f">&ndash;</span>&deg;F)</span></div>
        </div>

        <div class="stat-tile">
          <div class="stat-label">Bottom Temperature</div>
          <div class="stat-value"><span id="val-bottom">&ndash;</span><span class="stat-unit">&deg;C</span> <span class="stat-fahrenheit">(<span id="val-bottom-f">&ndash;</span>&deg;F)</span></div>
        </div>

        <div class="stat-tile">
          <div class="stat-label">Wind Speed</div>
          <div class="stat-value"><span id="val-wind">&ndash;</span><span class="stat-unit">mph</span></div>
        </div>

        <div class="stat-tile">
          <div class="stat-label">Wind Direction</div>
          <div class="stat-value stat-value-sm"><span id="val-winddir">&ndash;</span></div>
        </div>

        <div class="stat-tile">
          <div class="stat-label">Air Temperature</div>
          <div class="stat-value"><span id="val-airtemp">&ndash;</span><span class="stat-unit">&deg;C</span> <span class="stat-fahrenheit">(<span id="val-airtemp-f">&ndash;</span>&deg;F)</span></div>
        </div>

        <div class="stat-tile">
          <div class="stat-label">Relative Humidity</div>
          <div class="stat-value"><span id="val-rh">&ndash;</span><span class="stat-unit">%</span></div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div id="loadStatus" class="status"></div>
        <img src="assets/Limnology_buoy_Mendota_2024-10-16JM_1957.jpg" alt="David Buoy" class="buoy-thumb">
      </div>
    </aside>

    <main id="main">
      <section class="chart-panel profile-panel">
        <div class="chart-title-row">
          <div class="chart-title">Temperature Profile</div>
          <div class="chart-sub" id="profileAsOf"></div>
        </div>
        <div id="profileChart" class="chart-body"></div>
      </section>
    </main>
  </div>

  <script src="mendota.js"></script>
</body>

</html>
